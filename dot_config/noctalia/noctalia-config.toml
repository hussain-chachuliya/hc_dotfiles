compact = false
pinned = [
  "com.shellyorg.shelly",
  "thunar",
  "jetbrains-studio",
  "skills-manager",
  "ai.opencode.desktop",
  "obsidian",
  "brave-browser",
  "localsend",
  "io.github.bluemancz.hyprmod",
]
sort_by_usage = true

[shell.panel]
