# ~/.config/kitty/kitty.conf - curated essentials
# Generated 2026-10-10 - reload with ctrl+shift+f5 or kill -SIGUSR1 $KITTY_PID

include themes/noctalia.conf

# --- Fonts ---
# JetBrainsMono Nerd Font family
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
disable_ligatures never

# --- Window & Layout ---
remember_window_size  no
initial_window_width  90c
initial_window_height 26c
window_padding_width  8
window_margin_width   0
single_window_margin_width -1
window_border_width  0.5pt
hide_window_decorations no
confirm_os_window_close 0
placement_strategy center
enabled_layouts splits,stack,tall,fat,grid

# --- Background / Opacity ---
background_opacity 0.2
dynamic_background_opacity yes
background_blur 0
inactive_text_alpha 1.0

# --- Cursor ---
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
# cursor_trail 120  # uncomment for cursor trail animation
# cursor_trail_decay 0.1 0.4

# --- Scrollback ---
scrollback_lines 5000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# --- Tab Bar ---
tab_bar_edge bottom
tab_bar_style powerline
tab_bar_min_tabs 1
tab_powerline_style slanted
tab_title_template "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"
# tab colors are from themes/noctalia.conf - uncomment to override:
# active_tab_foreground   #e0e2e8
# active_tab_background   #93ccff
# inactive_tab_foreground #c0c7d1
# inactive_tab_background #404850

# --- Mouse / URLs ---
mouse_hide_wait 3.0
url_style curly
copy_on_select no
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#
click_interval 0.5
focus_follows_mouse no

# --- Performance ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# --- Bell ---
enable_audio_bell yes
visual_bell_duration 0.3
window_alert_on_bell yes
bell_on_tab "🔔 "

# --- Misc Important ---
allow_remote_control yes
listen_on unix:/tmp/mykitty
shell_integration enabled
editor nvim
auto_reload_config 1
update_check_interval 0

# --- Keyboard (kitty_mod = ctrl+shift) ---
kitty_mod ctrl+shift
map kitty_mod+t new_tab
map kitty_mod+w close_tab
map kitty_mod+enter new_window
map kitty_mod+n next_tab
map kitty_mod+p previous_tab
map kitty_mod+h neighboring_window left
map kitty_mod+l neighboring_window right
map kitty_mod+k neighboring_window up
map kitty_mod+j neighboring_window down
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0 change_font_size all 0
map kitty_mod+f2 edit_config_file
map kitty_mod+f5 load_config_file
map kitty_mod+f6 debug_config

# --- Wayland / Linux ---
linux_display_server auto
wayland_enable_ime yes
